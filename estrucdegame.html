<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Número Secreto</title>
  <link rel="stylesheet" href="estilodelgame.css">
</head>
<body>

  <main class="game-container">
    <div class="game-card">
      <h1>¿Cuál es el número?</h1>
      
      <p class="instructions">
        He elegido un número del <strong>1 al 10</strong>. Cada intento recibe una pista para ayudarte a acercarte al resultado.
      </p>

      <!-- Grupo de controles -->
      <div class="controls-row">
        <input type="number" id="userGuess" min="1" max="10" placeholder="1">
        <button id="btnTry" onclick="checkGuess()" class="btn-probar">Probar</button>
        <button id="btnReset" onclick="resetGame()" class="btn-reiniciar">Reiniciar</button>
      </div>

      <!-- Área de pistas y estado -->
      <p id="feedback" class="feedback-text"></p>
      
      <!-- Contador de intentos -->
      <p class="attempts-text">Intentos restantes: <strong id="attempts">3</strong></p>
    </div>
  </main>

  <script src="Juego.js"></script>
</body>
</html>
